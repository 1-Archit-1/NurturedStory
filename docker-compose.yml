version: '3.8'

services:
  web:
    build: .
    restart: unless-stopped
    volumes:
      - sqlite_data:/app/data
      - media_data:/app/media
    env_file:
      - .env
    ports:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  sqlite_data:
  media_data:
