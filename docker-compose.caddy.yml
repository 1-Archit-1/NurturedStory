# Extends docker-compose.yml with Caddy for self-hosted deploys (no Coolify).
# Usage: docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d --build

services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
