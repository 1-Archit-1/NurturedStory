version: '3.8'

services:
  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2
    volumes:
      # Persist the SQLite DB outside the container so it survives rebuilds
      - sqlite_data:/app/data
      # Shared volume so Caddy can serve collected static files
      - static_files:/app/staticfiles
    env_file:
      - .env
    ports:
      - "8000:8000"

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - static_files:/app/staticfiles:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  sqlite_data:
  static_files:
  caddy_data:
  caddy_config:
